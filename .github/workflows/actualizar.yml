name: Actualizar ofertas
on:
  schedule:
    - cron: "0 6,13,19 * * *"
      timezone: "America/Argentina/Buenos_Aires"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Buscar ofertas
        env:
          FORM_CSV_URL: ${{ secrets.FORM_CSV_URL }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: python robot/actualizar.py
      - name: Avisar en Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
        run: python robot/telegram.py
      - name: Guardar cambios
        run: |
          git config user.name "robot-rojas-trabaja"
          git config user.email "robot@users.noreply.github.com"
          touch data/telegram.json
          git add data/ofertas.json data/telegram.json
          git commit -m "Ofertas actualizadas $(date +%F)" || echo "Sin cambios"
          git push
